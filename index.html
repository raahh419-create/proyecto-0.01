<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0b1020;
      color: #eef2ff;
      display: grid;
      place-items: center;
      min-height: 100dvh;
    }
    .chat {
      width: min(100%, 760px);
      height: min(900px, 100dvh);
      display: flex;
      flex-direction: column;
      background: #121a2d;
      border: 1px solid #ffffff12;
      border-radius: 24px;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px;
      border-bottom: 1px solid #ffffff12;
    }
    .avatar {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 15px;
      background: #7664f5;
      font-size: 24px;
    }
    h1 { margin: 0; font-size: 19px; }
    .status { margin: 4px 0 0; color: #a6b0ca; font-size: 13px; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      background: #7664f5;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.15); }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, textarea:focus-visible {
      outline: 2px solid #c4b5fd;
      outline-offset: 3px;
    }
    #clear {
      margin-left: auto;
      background: #ffffff0c;
      font-size: 13px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message { max-width: 85%; align-self: flex-start; }
    .message.user { align-self: flex-end; }
    .bubble {
      padding: 13px 17px;
      border-radius: 18px 18px 18px 4px;
      background: #202b43;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user .bubble {
      background: #7664f5;
      border-radius: 18px 18px 4px 18px;
    }
    .meta {
      color: #a6b0ca;
      font-size: 11px;
      margin-top: 6px;
    }
    .user .meta { text-align: right; }
    #typing {
      min-height: 25px;
      padding: 0 20px;
      color: #a6b0ca;
      font-size: 13px;
    }
    form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #ffffff12;
    }
    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      border: 1px solid #ffffff15;
      border-radius: 12px;
      background: #0b1020;
      color: white;
      font: inherit;
      padding: 13px;
      height: 50px;
      max-height: 140px;
    }
    @media (max-width: 600px) {
      .chat { height: 100dvh; border: 0; border-radius: 0; }
      header { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <div class="avatar" aria-hidden="true">✦</div>
      <div>
        <h1>Mi Chat</h1>
        <p class="status">Bot de demostración · Sin conexión a IA</p>
      </div>
      <button id="clear" type="button">Borrar chat</button>
    </header>

    <section id="messages" role="log"
      aria-label="Conversación" aria-live="polite"></section>
    <div id="typing" role="status"></div>

    <form id="form">
      <textarea id="input" rows="1" maxlength="4000"
        placeholder="Escribe un mensaje…"
        aria-label="Mensaje"></textarea>
      <button id="send" type="submit">Enviar ↗</button>
    </form>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const storageKey = "mi-chat-v1";
    const messages = $("#messages");
    const input = $("#input");
    let history = [];
    let timer = null;

    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
      if (Array.isArray(saved)) {
        history = saved.filter(m =>
          m &&
          ["user", "bot"].includes(m.role) &&
          typeof m.text === "string" &&
          typeof m.time === "number" &&
          Number.isFinite(m.time)
        ).slice(-200);
      }
    } catch {
      // El chat funciona aunque el almacenamiento no esté disponible.
    }

    function save() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(history));
      } catch {}
    }

    function render(message) {
      const item = document.createElement("article");
      item.className = `message ${message.role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      // textContent evita interpretar los mensajes como HTML.
      bubble.textContent = message.text;

      const meta = document.createElement("div");
      meta.className = "meta";
      const hour = new Date(message.time).toLocaleTimeString("es", {
        hour: "2-digit", minute: "2-digit"
      });
      meta.textContent =
        `${message.role === "user" ? "Tú" : "Bot demo"} · ${hour}`;

      item.append(bubble, meta);
      messages.append(item);
      messages.scrollTop = messages.scrollHeight;
    }

    function addMessage(role, text) {
      const message = { role, text, time: Date.now() };
      history.push(message);
      if (history.length > 200) {
        history.shift();
        messages.firstElementChild?.remove();
      }
      render(message);
      save();
    }

    function welcome() {
      addMessage("bot",
        "¡Hola! 👋 Soy un bot de demostración con respuestas programadas. " +
        "Puedes saludarme, pedirme la hora o escribir «ayuda»."
      );
    }

    function reply(text) {
      const normalized = text.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

      if (/\b(hola|buenas|hey)\b/.test(normalized))
        return "¡Hola! 😊 ¿Qué tal va tu día?";
      if (normalized.includes("hora"))
        return `Son las ${new Date().toLocaleTimeString("es", {
          hour: "2-digit", minute: "2-digit"
        })}.`;
      if (normalized.includes("ayuda"))
        return "Prueba con «hola», «qué hora es» o «gracias». " +
          "Este chat guarda los últimos 200 mensajes en este navegador. " +
          "Usa Shift + Enter para escribir una nueva línea.";
      if (normalized.includes("gracias"))
        return "¡De nada! ✨";
      return "He recibido tu mensaje. Soy un bot de prueba: " +
        "para responder libremente necesitaría conectarme a una IA.";
    }

    $("#form").addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || timer !== null) return;

      addMessage("user", text);
      input.value = "";
      input.style.height = "50px";
      $("#send").disabled = true;
      $("#typing").textContent = "El bot está escribiendo…";

      timer = setTimeout(() => {
        addMessage("bot", reply(text));
        $("#typing").textContent = "";
        $("#send").disabled = false;
        timer = null;
      }, 650);
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        $("#form").requestSubmit();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "50px";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    $("#clear").addEventListener("click", () => {
      if (!confirm("¿Borrar el historial de este chat?")) return;
      clearTimeout(timer);
      timer = null;
      history = [];
      messages.replaceChildren();
      $("#typing").textContent = "";
      $("#send").disabled = false;
      welcome();
    });

    history.forEach(render);
    if (!history.length) welcome();
  </script>
</body>
</html>
